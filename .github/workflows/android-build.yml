name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application (Vite)
        env:
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          fi

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK (Version 1.0.${{ github.run_number }})
        run: |
          cd android
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}" \
            --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/babytracker-v1.0.${{ github.run_number }}.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: babytracker-v1.0.${{ github.run_number }}-apk
          path: |
            android/app/build/outputs/apk/debug/babytracker-v1.0.${{ github.run_number }}.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/babytracker-v1.0.${{ github.run_number }}.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
