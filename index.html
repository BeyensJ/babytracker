<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23CE6B4C'/><path d='M50 24 C38 24 30 34 30 46 C30 62 48 76 50 78 C52 76 70 62 70 46 C70 34 62 24 50 24 Z' fill='%23FAF5EE'/><circle cx='50' cy='46' r='9' fill='%23CE6B4C'/></svg>" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby Tracker" />
    <meta name="application-name" content="Baby Tracker" />
    <meta name="description" content="A beautiful, serene baby tracking application. Track feeding, sleep, diapers, pumping, growth, and import your historical data seamlessly." />
    
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Baby Tracker</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('babytracker_device_theme_v1');
          if (!t) {
            var p = localStorage.getItem('babytracker_preferences_v1');
            if (p) {
              var parsed = JSON.parse(p);
              if (parsed && parsed.theme) t = parsed.theme;
            }
          }
          if (t === 'dark' || t === 'oled') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
